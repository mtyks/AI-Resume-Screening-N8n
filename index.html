<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Screening</title>
    <meta name="theme-color" content="#0b3d2c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b3d2c'/%3E%3Crect x='7' y='10' width='18' height='4' rx='2' fill='%23b7e35a'/%3E%3Crect x='7' y='18' width='12' height='4' rx='2' fill='%23a9d3bf'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
